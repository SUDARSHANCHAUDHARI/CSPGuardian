[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "cspguardian"
version = "1.0.0"
description = "Website security header and iframe policy analyzer for CSP, cookies, CORS, and framing risks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
csp-guardian = "apps.api.app.cli:main"
